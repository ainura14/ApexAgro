# Stage-окружение (QA-01). Запуск на сервере в /opt/apexagro:
#   docker compose -f docker-compose.stage.yml --env-file .env up -d
# Наружу открыт только Nginx (80/443). БД, Redis, RabbitMQ и MinIO доступны лишь внутри сети compose
# (админки — через SSH-туннель, см. README).
name: apexagro-stage

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: stage
      DB_URL: jdbc:postgresql://postgres:5432/apexagro
      DB_USERNAME: apexagro
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: apexagro
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SMS_TEST_NUMBERS: ${SMS_TEST_NUMBERS}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexagro
      POSTGRES_USER: apexagro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"     # только с самого сервера (SSH-туннель)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexagro -d apexagro"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: apexagro
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"   # админка только через SSH-туннель
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: apexagro
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"     # консоль только через SSH-туннель

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 apexagro "$$MINIO_PASSWORD" >/dev/null 2>&1; do sleep 2; done
        mc mb --ignore-existing local/apexagro-media local/apexagro-ai-images

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      STAGE_DOMAIN: ${STAGE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
