openapi: 3.0.3
info:
  title: Apex Agro - Me API
  version: 1.0.0
paths:
  /api/v1/me:
    get:
      summary: Данные текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                phone: "+996555123456"
                fullName: "Асан Усенов"
                language: "ru"
                verificationLevel: "IDENTIFIED"
                roles: ["SELLER"]
                avatarFileId: "99999999-9999-9999-9999-999999999999"
        '401':
          description: Не авторизован
    patch:
      summary: Обновить имя, язык или аватар
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: "Асан Усенов"
                language:
                  type: string
                  enum: [ky, ru]
                  example: "ky"
                avatarFileId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Профиль обновлен