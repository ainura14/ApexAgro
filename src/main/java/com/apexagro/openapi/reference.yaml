openapi: 3.0.3
info:
  title: Apex Agro - Reference API
  version: 1.0.0
paths:
  /api/v1/regions:
    get:
      summary: Список областей
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
            enum: [ky, ru]
            default: ru
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  code: "chuy"
                  name: "Чуйская область"
                  sortOrder: 1
                - id: "22222222-2222-2222-2222-222222222222"
                  code: "osh"
                  name: "Ошская область"
                  sortOrder: 2

  /api/v1/districts:
    get:
      summary: Список районов
      parameters:
        - name: regionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                - id: "33333333-3333-3333-3333-333333333333"
                  regionId: "11111111-1111-1111-1111-111111111111"
                  code: "alamudun"
                  name: "Аламудунский район"

  /api/v1/settlements:
    get:
      summary: Населенные пункты с координатами
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Поиск по названию
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                - id: "44444444-4444-4444-4444-444444444444"
                  districtId: "33333333-3333-3333-3333-333333333333"
                  code: "lebedinovka"
                  name: "Лебединовка"
                  lat: 42.8833
                  lon: 74.6833

  /api/v1/crops:
    get:
      summary: Список активных культур
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                - id: "55555555-5555-5555-5555-555555555555"
                  code: "bean"
                  name: "Фасоль"
                - id: "66666666-6666-6666-6666-666666666666"
                  code: "potato"
                  name: "Картофель"

  /api/v1/categories:
    get:
      summary: Дерево категорий (до 3 уровней)
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                - id: "77777777-7777-7777-7777-777777777777"
                  code: "harvest"
                  kind: "HARVEST"
                  name: "Урожай"
                  sortOrder: 1
                  children:
                    - id: "88888888-8888-8888-8888-888888888888"
                      code: "vegetables"
                      kind: "HARVEST"
                      name: "Овощи"
                      sortOrder: 1
                      children: []