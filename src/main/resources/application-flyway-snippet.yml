spring:
  flyway:
    enabled: true
    locations: classpath:db/migration          # Flyway сам обходит подпапки <schema>/
    default-schema: common                     # там будет flyway_schema_history
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate                       # схему делает только Flyway
    properties:
      hibernate.default_schema: common         # для таблицы event_publication Spring Modulith
    open-in-view: false