# BE3-04/BE3-06: тексты ошибок API на русском. Ключ: error.<CODE> (см. ErrorCode).
# Аргументы ApiException подставляются как {0}, {1}. Апострофы в текстах с аргументами удваивать: ''.
error.VALIDATION_FAILED=Данные запроса заполнены неверно
error.MALFORMED_REQUEST=Некорректный запрос
error.UNAUTHORIZED=Требуется вход в систему
error.FORBIDDEN=Недостаточно прав для этого действия
error.NOT_FOUND=Не найдено
error.METHOD_NOT_ALLOWED=Метод не поддерживается
error.NOT_ACCEPTABLE=Запрошенный формат ответа не поддерживается
error.CONFLICT=Действие противоречит текущему состоянию данных
error.CONCURRENT_MODIFICATION=Данные изменил другой пользователь. Обновите страницу и повторите действие
error.PAYLOAD_TOO_LARGE=Слишком большой размер запроса
error.UNSUPPORTED_MEDIA_TYPE=Тип данных не поддерживается
error.RATE_LIMITED=Слишком много запросов. Повторите немного позже
error.INTERNAL_ERROR=Внутренняя ошибка. Повторите попытку позже
error.SERVICE_UNAVAILABLE=Сервис временно недоступен

